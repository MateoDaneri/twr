[workspace]
members = ["crates/workspace-core", "crates/workspace-cli", "crates/workspace-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"

[profile.release]
lto = "thin"
codegen-units = 1

