[package]
name = "workspace-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:gpui", "dep:objc"]
ghostty = ["dep:cc", "dep:sha2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native-test"))'] }

[build-dependencies]
cc = { version = "=1.9.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
serde_json.workspace = true

[dependencies]
workspace-core = { path = "../workspace-core" }
sha2 = "=0.10.9"
serde.workspace = true
serde_json.workspace = true
portable-pty.workspace = true
vt100 = "=0.18.1"
tree-sitter = "=0.27.1"
tree-sitter-highlight = "=0.27.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-c = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-lua = "=0.5.0"
tree-sitter-hcl = "=1.1.0"
tree-sitter-python = "=0.25.0"
regex = "=1.13.1"
libc = "=0.2.191"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.12.0"
async-channel = "=2.5.0"
pulldown-cmark = { version = "=0.13.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "=0.2.7", optional = true }

[[bin]]
name = "terminal-workspace"
path = "src/main.rs"
required-features = ["native"]
