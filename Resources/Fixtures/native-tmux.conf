# App-owned server only. Static navigation contract; no personal hooks/plugins.
set -g prefix C-a
unbind C-b
set -g base-index 1
set -g pane-base-index 1
set -g default-shell /bin/sh
set -g default-terminal tmux-256color
set -g destroy-unattached off
set -g mouse on
set -g mode-keys vi
set -g status off
set -g set-clipboard off
set -s extended-keys on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
# This unusual M-7 target is present in the user's static config.
bind -n M-7 select-window -t :4
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0
bind m switch-client -T movepane
bind -T movepane 0 { join-pane -t :0 ; select-window -t :0 }
bind -T movepane 1 { join-pane -t :1 ; select-window -t :1 }
bind -T movepane 2 { join-pane -t :2 ; select-window -t :2 }
bind -T movepane 3 { join-pane -t :3 ; select-window -t :3 }
bind -T movepane 4 { join-pane -t :4 ; select-window -t :4 }
bind -T movepane 5 { join-pane -t :5 ; select-window -t :5 }
bind -T movepane 6 { join-pane -t :6 ; select-window -t :6 }
bind -T movepane 7 { join-pane -t :7 ; select-window -t :7 }
bind -T movepane 8 { join-pane -t :8 ; select-window -t :8 }
bind -T movepane 9 { join-pane -t :9 ; select-window -t :9 }
bind x display-menu -T 'Cerrar pane?' 'Sí' y kill-pane 'No' n ''
bind & display-menu -T 'Cerrar ventana?' 'Sí' y kill-window 'No' n ''
bind -T copy-mode-vi MouseDragEnd1Pane send -X end-selection
bind -T copy-mode-vi C-S-c send -X copy-selection-and-cancel
