set -g prefix C-a
unbind C-b
set -g base-index 1
set -g pane-base-index 1
set -g default-shell /bin/sh
set -g default-terminal tmux-256color
set -g mouse on
set -g mode-keys vi
set -g status-position top
set -g status-style 'bg=#233b3d,fg=#c8d9d3'
set -g status-left ' DEMO '
set -g status-right ' tmux real '
set -g status-interval 5
set -g set-clipboard on
set -g allow-passthrough on
set -s extended-keys on
set -s user-keys[0] "\e[1;10A"
set -s user-keys[1] "\e[1;10B"
set -s user-keys[2] "\e[1;10C"
set -s user-keys[3] "\e[1;10D"
bind -n User0 select-pane -U
bind -n User1 select-pane -D
bind -n User2 select-pane -R
bind -n User3 select-pane -L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind x display-menu -T "Cerrar pane?" "Si" y "kill-pane" "No" n ""
bind & display-menu -T "Cerrar ventana?" "Si" y "kill-window" "No" n ""
bind -n C-t display-popup -E -w 70% -h 50% "/bin/sh -c 'printf \"Pendientes sinteticos\n\nEnter para volver\"; read answer'"
bind a display-popup -E -w 70% -h 50% "/bin/sh -c 'printf \"Agentes sinteticos\n\nEnter para volver\"; read answer'"
bind m switch-client -T movepane
bind -T movepane 1 join-pane -t :1
bind -T movepane 2 join-pane -t :2
